# XcodeGen project definition — the single source of truth for the Xcode project.
#
# On the Mac:   brew install xcodegen && xcodegen generate && open GooglePhotosImporter.xcodeproj
#
# The generated .xcodeproj is gitignored on purpose (see CLAUDE.md → "Project file
# format"). Edit THIS file, then re-run `xcodegen generate`.
name: GooglePhotosImporter

options:
  # TODO: change to your own reverse-DNS prefix (must be unique per Apple ID for
  # free-account signing to work).
  bundleIdPrefix: com.rohangoel
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Config/Secrets.xcconfig is gitignored; allow generation before it exists so a
  # fresh clone still produces a project (the app then reports "not configured").
  disabledValidations:
    - missingConfigFiles

configs:
  Debug: debug
  Release: release

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  GooglePhotosImporter:
    type: application
    platform: iOS
    sources:
      - path: GooglePhotosImporter
        excludes:
          - "Info.plist"           # generated below, never a source
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      # XcodeGen writes this file on every `generate`; it is gitignored.
      path: GooglePhotosImporter/Info.plist
      properties:
        CFBundleDisplayName: Photos Importer
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Values come from Config/Secrets.xcconfig at build time. If that file is
        # missing they resolve to empty strings and the app shows a setup error.
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: google-sign-in
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        NSPhotoLibraryAddUsageDescription: >-
          Photos Importer saves the pictures you pick from Google Photos into
          your Photos library.
        NSPhotoLibraryUsageDescription: >-
          Photos Importer needs library access to create and add to the
          "Imported from Google Photos" album.
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        # DEVELOPMENT_TEAM is deliberately NOT set here so the value from
        # Config/Secrets.xcconfig (or Xcode's Signing tab) wins.

  GooglePhotosImporterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GooglePhotosImporterTests
    dependencies:
      - target: GooglePhotosImporter
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GooglePhotosImporter:
    build:
      targets:
        GooglePhotosImporter: all
        GooglePhotosImporterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GooglePhotosImporterTests
    archive:
      config: Release
